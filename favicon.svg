<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient: Sacred Forest & Warm Sage -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D4F38"/>
      <stop offset="100%" stop-color="#1B3224"/>
    </linearGradient>
    
    <!-- Warm Gold Gradient for Ka'bah Band & Crescent -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3DC9B"/>
      <stop offset="50%" stop-color="#D4AF65"/>
      <stop offset="100%" stop-color="#A57E34"/>
    </linearGradient>

    <!-- Gentle Glow -->
    <radialGradient id="haloGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#FFF2D6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#2D4F38" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Friendly Rounded Container with subtle border -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#B38E46" stroke-width="2" stroke-opacity="0.5"/>

  <!-- Halo Soft Aura -->
  <circle cx="32" cy="30" r="24" fill="url(#haloGlow)"/>

  <!-- Open Mushaf / Book base (representing Doa & Zikir) -->
  <path d="M14 47 C20 44, 28 44, 32 46 C36 44, 44 44, 50 47 L48 51 C43 49, 36 49, 32 50 C28 49, 21 49, 16 51 Z" fill="#F6F4EE" opacity="0.95"/>

  <!-- Stylized Ka'bah (Isometric / Friendly perspective) -->
  <g transform="translate(0, -1)">
    <!-- Main Cube Body -->
    <rect x="22" y="20" width="20" height="21" rx="3.5" fill="#1C1F1D" stroke="#3D4540" stroke-width="1.2"/>
    <!-- Golden Kiswah Kiswah Band (Tirai Kaligrafi Emas) -->
    <rect x="22" y="25" width="20" height="4" fill="url(#goldGrad)" rx="0.5"/>
    <!-- Golden Door (Bab Ka'bah) -->
    <rect x="33" y="31" width="5.5" height="10" rx="1.5" fill="url(#goldGrad)"/>
    <!-- Subtle Door line -->
    <line x1="35.7" y1="31" x2="35.7" y2="41" stroke="#876223" stroke-width="0.8"/>
  </g>

  <!-- Warm Golden Crescent (Hilal Keberkahan & Keramahan) -->
  <path d="M46 11 A 11 11 0 0 0 35 22 A 11 11 0 0 1 45 13 A 10 10 0 0 1 48 11.5 A 11 11 0 0 0 46 11 Z" fill="url(#goldGrad)"/>

  <!-- Twinkling Little Star (Menyenangkan & Bersahabat) -->
  <path d="M48 10 L49 12 L51 13 L49 14 L48 16 L47 14 L45 13 L47 12 Z" fill="#FFF2D6"/>
  <circle cx="17" cy="18" r="1.5" fill="#E6C87C" opacity="0.85"/>
</svg>
